name: QA Execution Run

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment the build under test is deployed to'
        required: false
        default: 'Staging Sandbox'
      qa_lead:
        description: 'GitHub handle of the QA lead (no @)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: qa-execution-${{ github.ref }}
  cancel-in-progress: false

env:
  QA_PROJECT: publishio
  QA_VAULT_REPO: rtCamp/qa
  QA_VAULT_REF: master

jobs:
  build-plugin-zip:
    name: Build Plugin Zip
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build.yml
    with:
      php-version: '8.2'
      artifact-name: publishio-qa-${{ github.run_id }}
    secrets: inherit

  automated-mounted:
    name: Automated gate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [full, smoke-wp69]
    uses: ./.github/workflows/reusable-e2e-public.yml
    with:
      php-version: '8.2'
      plugin-slug: publishio
      project: ${{ matrix.project }}
      update: all
      # notify-slack: false
    secrets: inherit

  automated-install:
    name: Automated gate
    needs: build-plugin-zip
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [install, install-wp69]
    uses: ./.github/workflows/reusable-e2e-public.yml
    with:
      php-version: '8.2'
      plugin-slug: publishio
      project: ${{ matrix.project }}
      update: all
      zip-artifact: publishio-qa-${{ github.run_id }}
      # notify-slack: false
    secrets: inherit

  launch-qa-checklist:
    name: Open QA checklist issue
    needs: [automated-mounted, automated-install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Fetch the publishio blueprints from the QA vault
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.QA_VAULT_REPO }}
          ref: ${{ env.QA_VAULT_REF }}
          token: ${{ secrets.RTBOT_TOKEN }}
          path: qa-vault
          sparse-checkout: qa-management/${{ env.QA_PROJECT }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate blueprints exist
        run: |
          set -euo pipefail
          SUITE_DIR="qa-vault/qa-management/${QA_PROJECT}"
          # The smoke file is spelled `smoke-suit.md` in the vault (not "suite").
          for FILE in smoke-suit.md regression-suite.md; do
            if [ ! -f "${SUITE_DIR}/${FILE}" ]; then
              echo "::error::Missing ${SUITE_DIR}/${FILE} in ${QA_VAULT_REPO}. Add qa-management/${QA_PROJECT}/ to the vault."
              exit 1
            fi
          done

      - name: Open the live QA issue
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          QA_LEAD: ${{ inputs.qa_lead }}
          ENVIRONMENT: ${{ inputs.environment || 'Staging Sandbox' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SUITE_DIR="qa-vault/qa-management/${QA_PROJECT}"
          {
            echo "## 📋 Release Execution Context"
            echo "* **Project:** \`${QA_PROJECT}\`"
            echo "* **Branch:** \`${REF_NAME}\` (release tag \`${REF_NAME#release/}\`)"
            echo "* **Commit:** ${SHA}"
            echo "* **Triggered By:** @${ACTOR}"
            echo "* **Environment:** ${ENVIRONMENT}"
            echo "* **Automated E2E gate:** passed, [report and artifacts](${RUN_URL})"
            echo "* **Blueprint Source:** [\`qa-management/${QA_PROJECT}\`](https://github.com/${QA_VAULT_REPO}/tree/${QA_VAULT_REF}/qa-management/${QA_PROJECT})"
            echo ""
            echo "> Tick boxes as you verify. For every failure, open a separate bug issue with a"
            echo "> priority label (P0-P3) and link it under **Blockers Found** below."
            echo ""
            echo "---"
            echo ""
            cat "${SUITE_DIR}/smoke-suit.md"
            echo ""
            echo "---"
            echo ""
            cat "${SUITE_DIR}/regression-suite.md"
            echo ""
            echo "---"
            echo ""
            echo "## 🐞 Blockers Found"
            echo "<!-- One line per bug, e.g. - [ ] #123 Connections screen blank on 6.9 -->"
            echo "_None yet._"
            echo ""
            echo "---"
            echo ""
            echo "## 🚦 Release gate (checked by release.yml when the tag is pushed)"
            echo "* Close this issue with the **\`qa-passed\`** label to allow the WordPress.org deploy."
            echo "* Add **\`qa-blocked\`** to stop the release, whatever else is set."
            echo "* Bugs linked under **Blockers Found** that are still open must be **P2** or **P3**"
            echo "  (deferred to a later release). Any open **P0/P1**, or an open bug without a"
            echo "  priority label, blocks the release."
            echo ""
            echo "## 🏁 Final Verification & Release Sign-Off"
            echo "- [ ] **All smoke checks pass**"
            echo "- [ ] **Regression testing complete**"
            echo "- [ ] **All P0/P1 blockers resolved; P2/P3 deferrals agreed**"
            echo "- [ ] **Release notes / changelog verified**"
            echo ""
            echo "**Signed off by:** @ &nbsp;&nbsp; **Date:** ____"
          } > qa-issue-body.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[QA Run] ${QA_PROJECT} Release Verification — ${REF_NAME}" \
            --label qa-testing --label release-blocker \
            --assignee "${QA_LEAD:-$ACTOR}" \
            --body-file qa-issue-body.md
