# Playwright E2E tests.
#
# A pull request or push is a plugin update: it runs the tests tagged @plugin-update.
# Kept short so it does not hold up developers; every other environment runs nightly/weekly
# (e2e-scheduled.yml) once the change is on main.
# - Pull requests: latest WordPress only. smoke split into 2 parallel jobs (shards) + install,
#   which builds its own zip (no wait for a separate build job). 3 jobs in parallel.
# - Push to main: the same plus WordPress 6.9, the declared minimum (smoke-wp69 in 2 shards +
#   install-wp69). Slack alerts on failure are commented out until the webhook is available.
# - Manual: Actions → E2E → Run workflow, pick the branch in "Use workflow from", then the projects
#   and the update type. WordPress releases are covered by wp-release-watch.yml (@wp-update).
name: E2E

on:
  # PR-TRIGGER (disabled until the suite has been verified on a branch; uncomment to run E2E on
  # every pull request automatically):
  # pull_request:
    # types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      # TEMPORARY: runs on pushes to the E2E branch while the suite is verified. Before merging,
      # switch back to main (and uncomment the pull_request trigger above).
      - e2e-playwright-tests
      # - main
  workflow_dispatch:
    inputs:
      projects:
        description: 'What to run'
        type: choice
        options: [all, smoke, install, full, smoke-wp69, install-wp69]
        default: all
      update:
        description: 'Which tests: tagged @plugin-update, tagged @wp-update, or all'
        type: choice
        options: [plugin-update, wp-update, all]
        default: plugin-update
      wp-version:
        description: 'wp-env core for projects without a pinned version (smoke, install, full), e.g. "WordPress/WordPress#7.0". Empty = latest.'
        type: string
        default: ''
      php-version:
        description: 'PHP for projects without a pinned version'
        type: choice
        options: ['8.2', '8.3', '8.4']
        default: '8.2'
      theme:
        description: 'Theme slug'
        type: string
        default: 'twentytwentyfive'

# A new push to a PR cancels that PR's run still in progress and starts one for the latest commit.
# Grouped by PR number (branch names can repeat across forks). Pushes to main and manual runs each
# get their own group, so they always finish and report.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format( 'pr-{0}', github.event.pull_request.number ) || format( 'run-{0}', github.run_id ) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The jobs to run, as a matrix of {project, shard}. Mounted projects (smoke, full, …) run as 2
  # shards; install projects run whole (their tests share one site, in order) and build the zip.
  # Skipped entirely (no E2E jobs) when a PR or push changes no code: only Markdown, docs/,
  # .wordpress-org/ assets or the licence. Manual runs always run.
  plan:
    name: Pick projects
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read # list a PR's changed files
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Detect code changes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          # A file counts as code unless it matches one of the excluded patterns.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.wordpress-org/**'
              - '!LICENSE*'

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.projects }}
          CODE_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true' }}
        run: |
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "No code changes (only docs or assets), so E2E tests are skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "jobs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT:$CHOICE" in
            pull_request:*) projects='smoke install' ;;
            push:*) projects='smoke install smoke-wp69 install-wp69' ;;
            *:all) projects='smoke install smoke-wp69 install-wp69' ;;
            *) projects="$CHOICE" ;;
          esac
          # shellcheck disable=SC2086 # word-split the project list on purpose
          jobs=$(printf '%s\n' $projects | jq -Rnc '[ inputs | if startswith( "install" )
            then { project: ., shard: "" }
            else ( { project: ., shard: "1/2" }, { project: ., shard: "2/2" } ) end ]')
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "E2E jobs: \`$jobs\`" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON( needs.plan.outputs.jobs ) }}
    uses: ./.github/workflows/reusable-e2e-public.yml
    with:
      plugin-slug: publishio
      project: ${{ matrix.project }}
      shard: ${{ matrix.shard }}
      build-zip: true
      update: ${{ inputs.update || 'plugin-update' }}
      wp-version: ${{ inputs.wp-version || '' }}
      php-version: ${{ inputs.php-version || '8.2' }}
      theme: ${{ inputs.theme || 'twentytwentyfive' }}
      # notify-slack: ${{ github.event_name == 'push' }}  # SLACK disabled for now
    secrets: inherit
