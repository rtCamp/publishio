name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # GitHub can't restrict the ref picker in YAML, so enforce main-only at runtime.
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Manual dry-run must be dispatched from main (got: $REF)."
              exit 1
            fi
            echo "Manual dry-run from main — OK."
          else
            # Tag push: the release tag must point to a commit that is on main.
            if ! git merge-base --is-ancestor "refs/tags/$REF_NAME" origin/main; then
              echo "::error::Tag $REF_NAME does not point to a commit on origin/main."
              exit 1
            fi
            echo "Tag $REF_NAME is on main — OK."
          fi

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/reusable-build.yml
    with:
      php-version: '8.2'
      artifact-name: publishio
    secrets: inherit

  release-tests:
    name: Release tests (install + upgrade on the release zip)
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-e2e-public.yml
    with:
      php-version: '8.2'
      plugin-slug: publishio
      project: install
      update: plugin-update
      zip-artifact: publishio
      # notify-slack: true  # SLACK disabled for now
    secrets: inherit

  # Tag pushes deploy only after manual QA signed off in the qa-management QA run issue for
  # release/<tag> (opened by qa-execution-runner.yml): closed with qa-passed, no qa-blocked, and
  # no open P0/P1 blockers (P2/P3 may be deferred). Rules: bin/qa-release-gate.mjs.
  qa-gate:
    name: QA release gate (qa-management)
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check the QA run issue for this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: node bin/qa-release-gate.mjs "$TAG"

  wordpress-org-release:
    name: Create WordPress.org release
    needs: [validate, build, release-tests, qa-gate]
    # A manual dry run from main has no tag and no QA run, so the gate is skipped there.
    if: always() && needs.validate.result == 'success' && needs.build.result == 'success' && needs.release-tests.result == 'success' && (needs.qa-gate.result == 'success' || (needs.qa-gate.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    # QA approves the deploy: add QA as required reviewers on the "production" environment.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publishio
          path: .

      - name: Unzip built plugin
        run: unzip -q publishio.zip -d svn-build

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: publishio
          VERSION: ${{ github.ref_name }}
          BUILD_DIR: ./svn-build/publishio

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, build, release-tests, qa-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publishio
          path: .

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: publishio.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
